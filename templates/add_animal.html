<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PashuAadhar - Add Animal</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }


        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }


        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }


        h1 {
            margin: 0;
        }


        .language-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .language-box select {
            width: auto;
            margin: 0;
            padding: 8px;
        }


        select,
        input,
        textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }


        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }


        .full {
            grid-column: 1 / 3;
        }


        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }


        button:hover {
            opacity: 0.9;
        }


        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
        }


        @media(max-width:700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="top">


        <h1 data-i18n="registerNewAnimal">

            Register New Animal

        </h1>


        <div class="language-box">

            <label for="languageSelect"
                   data-i18n="language">

                Language

            </label>


            <select id="languageSelect">

                <option value="en">
                    English
                </option>

                <option value="mr">
                    मराठी
                </option>

                <option value="hi">
                    हिन्दी
                </option>

            </select>

        </div>


    </div>


    <a href="/dashboard"
       class="back"
       data-i18n="back">

        ← Back

    </a>



    <form method="POST"
          action="/add-animal">


        <div class="form-grid">


            <div>

                <label data-i18n="animalName">
                    Animal Name
                </label>

                <input
                    type="text"
                    name="animal_name"
                    placeholder="Animal Name"
                    data-i18n-placeholder="animalName"
                    required>

            </div>



            <div>

                <label data-i18n="animalType">
                    Animal Type
                </label>

                <select name="animal_type"
                        required>

                    <option value="Cow"
                            data-i18n="cow">

                        Cow

                    </option>

                    <option value="Buffalo"
                            data-i18n="buffalo">

                        Buffalo

                    </option>

                </select>

            </div>



            <div>

                <label data-i18n="breed">
                    Breed
                </label>

                <input
                    type="text"
                    name="breed"
                    placeholder="Breed"
                    data-i18n-placeholder="breed">

            </div>



            <div>

                <label data-i18n="gender">
                    Gender
                </label>

                <select name="gender">

                    <option value="Male"
                            data-i18n="male">

                        Male

                    </option>

                    <option value="Female"
                            data-i18n="female">

                        Female

                    </option>

                </select>

            </div>



            <div>

                <label data-i18n="dateOfBirth">
                    Date of Birth
                </label>

                <input
                    type="date"
                    name="date_of_birth">

            </div>



            <div>

                <label data-i18n="color">
                    Color
                </label>

                <input
                    type="text"
                    name="color"
                    placeholder="Color"
                    data-i18n-placeholder="color">

            </div>



            <div>

                <label data-i18n="ownerName">
                    Owner Name
                </label>

                <input
                    type="text"
                    name="owner_name"
                    placeholder="Owner Name"
                    data-i18n-placeholder="ownerName"
                    required>

            </div>



            <div>

                <label data-i18n="phoneNumber">
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="owner_phone"
                    placeholder="Phone Number"
                    data-i18n-placeholder="phoneNumber">

            </div>



            <div>

                <label data-i18n="purchaseDate">
                    Purchase Date
                </label>

                <input
                    type="date"
                    name="purchase_date">

            </div>



            <div>

                <label data-i18n="pregnancyCount">
                    Pregnancy Count
                </label>

                <input
                    type="number"
                    name="pregnancy_count"
                    min="0"
                    value="0">

            </div>



            <div>

                <label data-i18n="calvingCount">
                    Calving Count
                </label>

                <input
                    type="number"
                    name="calving_count"
                    min="0"
                    value="0">

            </div>



            <div>

                <label data-i18n="milkPerDay">
                    Milk Production (Litres/Day)
                </label>

                <input
                    type="number"
                    step="0.1"
                    name="milk_production"
                    min="0">

            </div>



            <div class="full">

                <label data-i18n="notes">
                    Notes
                </label>

                <textarea
                    name="notes"
                    rows="5"
                    placeholder="Notes"
                    data-i18n-placeholder="notes"></textarea>

            </div>



            <div class="full">

                <button type="submit"
                        data-i18n="saveAnimal">

                    Save Animal

                </button>

            </div>


        </div>


    </form>


</div>



<script src="{{ url_for('static', filename='js/language.js') }}"></script>


</body>

</html>
