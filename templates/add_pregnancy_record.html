<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Pregnancy Record | PashuAadhar</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #236b45;
            margin-bottom: 10px;
        }

        .animal-info {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
        }

        .save-btn {
            background: #236b45;
            color: white;
        }

        .back-btn {
            background: #e5e7eb;
            color: #222;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px 12px;
                padding: 20px;
            }

            .button-group .btn {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Pregnancy & Calving Record</h1>

        <div class="animal-info">
            <p><strong>Animal ID:</strong> {{ animal['animal_id'] }}</p>
            <p><strong>Animal Name:</strong> {{ animal['animal_name'] }}</p>
            <p><strong>Animal Type:</strong> {{ animal['animal_type'] }}</p>
        </div>

        <form method="POST">

            <div class="form-group">
                <label for="pregnancy_date">
                    Pregnancy Confirmation Date *
                </label>
                <input
                    type="date"
                    id="pregnancy_date"
                    name="pregnancy_date"
                    required
                >
            </div>

            <div class="form-group">
                <label for="expected_calving_date">
                    Expected Calving Date
                </label>
                <input
                    type="date"
                    id="expected_calving_date"
                    name="expected_calving_date"
                >
            </div>

            <div class="form-group">
                <label for="actual_calving_date">
                    Actual Calving Date
                </label>
                <input
                    type="date"
                    id="actual_calving_date"
                    name="actual_calving_date"
                >
            </div>

            <div class="form-group">
                <label for="calving_outcome">Calving Outcome</label>
                <select id="calving_outcome" name="calving_outcome">
                    <option value="">Select outcome</option>
                    <option value="Pending">Pending</option>
                    <option value="Normal">Normal</option>
                    <option value="Assisted">Assisted delivery</option>
                    <option value="Stillbirth">Stillbirth</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="calf_count">Number of Calves</label>
                <input
                    type="number"
                    id="calf_count"
                    name="calf_count"
                    min="0"
                    value="0"
                >
            </div>

            <div class="form-group">
                <label for="veterinarian">Veterinarian Name</label>
                <input
                    type="text"
                    id="veterinarian"
                    name="veterinarian"
                    placeholder="Enter veterinarian's name"
                >
            </div>

            <div class="form-group">
                <label for="notes">Additional Notes</label>
                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Enter observations or additional information"
                ></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn save-btn">
                    Save Pregnancy Record
                </button>

                <a
                    href="{{ url_for('animal_details', animal_id=animal['animal_id']) }}"
                    class="btn back-btn"
                >
                    Back to Animal Details
                </a>
            </div>

        </form>

    </div>

</body>
</html>
